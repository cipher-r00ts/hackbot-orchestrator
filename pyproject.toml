[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackbot"
version = "0.1.0"
description = "Filesystem-first bug bounty target, finding, and recon manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hackbot = "hackbot.cli:main"

[tool.setuptools.packages.find]
include = ["hackbot*"]
